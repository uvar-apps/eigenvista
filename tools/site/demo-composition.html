<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>EigenVista: one density surface, three views</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body { color: #151613; font-family: "Helvetica Neue", Arial, sans-serif; }
      #demo-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; }
      #demo-background { inset: 0; background: #17232d; }
      #demo-video { left: 0; top: 120px; width: 1920px; height: 960px; object-fit: contain; }
      #demo-header { inset: 0 0 auto; height: 120px; background: #ecebe4; border-bottom: 4px solid #151613; }
      #demo-brand { position: absolute; left: 28px; top: 23px; width: 365px; height: 70px; display: flex; align-items: center; gap: 17px; border-right: 3px solid #151613; }
      #demo-brand img { display: block; width: 62px; height: 62px; }
      #demo-brand strong { font-size: 43px; font-weight: 900; letter-spacing: -2px; }
      .beat { left: 426px; top: 19px; width: 1460px; height: 46px; margin: 0; font-size: 35px; font-weight: 750; letter-spacing: -0.7px; line-height: 46px; opacity: 0; }
      .step { display: inline-block; width: 56px; height: 39px; margin-right: 16px; border: 2px solid #151613; background: #f5d66f; font: 700 28px/35px Menlo, monospace; text-align: center; vertical-align: 3px; }
      #demo-facts { position: absolute; left: 427px; top: 76px; margin: 0; font: 28px Menlo, monospace; letter-spacing: 0.1px; }
      #demo-install { font-size: 33px; }
    </style>
  </head>
  <body>
    <main id="demo-root" data-composition-id="eigenvista-demo" data-width="1920" data-height="1080" data-duration="30">
      <div id="demo-background" class="clip" data-start="0" data-duration="30" data-track-index="0"></div>
      <video id="demo-video" class="clip" src="assets/demo.mp4" data-start="0" data-duration="30" data-track-index="1" muted playsinline></video>
      <header id="demo-header" class="clip" data-start="0" data-duration="30" data-track-index="2">
        <div id="demo-brand"><img src="assets/logo.svg" alt="EigenVista logo"><strong>EigenVista</strong></div>
        <p id="demo-facts">C₇H₁₀ · density 0.04 e/bohr³ · 256³ grid · actual app</p>
      </header>
      <p id="demo-solid" class="clip beat" data-start="0" data-duration="DEMO_XRAY_TIME" data-track-index="3"><span class="step">01</span>Solid density — the molecular envelope</p>
      <p id="demo-xray" class="clip beat" data-start="DEMO_XRAY_TIME" data-duration="DEMO_XRAY_DURATION" data-track-index="3"><span class="step">02</span>X-ray shader — change opacity live</p>
      <p id="demo-clip" class="clip beat" data-start="DEMO_CLIP_TIME" data-duration="DEMO_CLIP_DURATION" data-track-index="3"><span class="step">03</span>Clipping shader — move the boundary live</p>
      <p id="demo-install" class="clip beat" data-start="27" data-duration="3" data-track-index="3">Install &amp; explore: uvar-apps.github.io/eigenvista</p>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      const xrayTime = Number("DEMO_XRAY_TIME");
      const clipTime = Number("DEMO_CLIP_TIME");
      timeline.fromTo("#demo-brand", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0);
      for (const [id, start, end] of [
        ["demo-solid", 0, xrayTime],
        ["demo-xray", xrayTime, clipTime],
        ["demo-clip", clipTime, 27],
        ["demo-install", 27, 30],
      ]) {
        timeline.fromTo(`#${id}`, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, start);
        if (end < 30) timeline.to(`#${id}`, { opacity: 0, y: -4, duration: 0.15, ease: "none" }, end - 0.15);
      }
      window.__timelines["eigenvista-demo"] = timeline;
    </script>
  </body>
</html>
